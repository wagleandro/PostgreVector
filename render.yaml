services:
  - type: web_service
    name: postgrest-api
    runtime: docker
    plan: starter
    dockerfilePath: Dockerfile
    envVars:
      - key: PGRST_DB_URI
        value: postgresql://user:password@host:5432/appdb
        sync: false
      - key: PGRST_DB_SCHEMAS
        value: public
      - key: PGRST_DB_ANON_ROLE
        value: web_anon
      - key: PORT
        value: "10000"
        sync: false
    autoDeployTrigger: commit
    healthCheckPath: /health_check?id=eq.1
    healthCheckIntervalSeconds: 30
