services:
  - type: web_service
    name: postgrest-api
    runtime: docker
    plan: starter
    dockerfilePath: Dockerfile
    envVars:
      - key: PGRST_DB_URI
        fromDatabase:
          databaseName: postgres-db
          property: connectionString
      - key: PGRST_DB_SCHEMAS
        value: public
      - key: PGRST_DB_ANON_ROLE
        value: web_anon
    autoDeployTrigger: commit
    healthCheckPath: /
    healthCheckIntervalSeconds: 10

databases:
  - name: postgres-db
    plan: starter
    databaseName: appdb
    postgresVersion: "15"
    region: oregon
    extensions:
      - pgvector
